<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>雷霆战鹰 · Thunder Hawk</title>
<link rel="stylesheet" href="src/css/style.css?v=1311">
</head>
<body>
<div id="stage">
  <canvas id="game" width="480" height="720"></canvas>

  <!-- HUD 层 -->
  <div id="hud" class="hidden">
    <div id="hud-score">SCORE <span id="score">0</span></div>
    <div id="hud-best">BEST <span id="best">0</span></div>
    <div id="hud-top"><span id="hud-stage">第 1 关</span><span id="hud-diff"></span></div>
    <div id="hud-buffs"></div>
    <div id="hud-lives"></div>
    <div id="hud-bombs"></div>
    <div id="hud-energy"><div id="hud-energy-fill"></div></div>
    <div id="hud-weapon"></div>
    <button id="btn-mute" title="静音 (M)">🔊</button>
    <button id="btn-exit" title="暂停 / 退出">✕</button>
  </div>
  <div id="boss-bar" class="hidden">
    <div id="boss-name">DREADNOUGHT</div>
    <div id="boss-hp-wrap"><div id="boss-hp"></div></div>
  </div>
    <div id="wave-banner" class="hidden"></div>
    <div id="hud-combo"></div>

  <!-- 界面层 -->
  <div id="screen-title" class="screen">
    <div class="logo">
      <div class="logo-sub">THUNDER HAWK</div>
      <div class="logo-main">雷 鹰 战 机</div>
    </div>
    <div class="diff-row">
      <button class="btn-diff" data-diff="easy">轻松</button>
      <button class="btn-diff active" data-diff="normal">标准</button>
      <button class="btn-diff" data-diff="hard">炼狱</button>
    </div>
    <button id="btn-start" class="btn">开始出击</button>
    <div class="feature-row">
      <button class="btn-mini" id="btn-fleet">战机</button>
      <button class="btn-mini" id="btn-gacha">抽卡</button>
      <button class="btn-mini" id="btn-bag">背包</button>
      <button class="btn-mini" id="btn-stage">选关</button>
      <button class="btn-mini" id="btn-keys">键位</button>
      <button class="btn-mini" id="btn-howto">玩法</button>
    </div>
    <div class="title-best">最高纪录 <span id="best-title">0</span></div>
    <div class="title-ach" id="btn-ach" title="点击查看成就">★ 成就 <span id="ach-count">0</span>/14</div>
    <div class="title-stats" id="title-stats"></div>
    <div class="version-tag">v13.1</div>
  </div>

  <div id="screen-pause" class="screen hidden">
    <div class="screen-title">暂停</div>
    <div class="pause-stats">
      <p>玩家 <b id="pause-player">玩家1</b> · 得分 <b id="pause-score">0</b> · 关卡 <b id="pause-stage">1</b> · 连击 <b id="pause-combo">×0</b></p>
      <p class="pause-keys">Enter 继续 &nbsp;|&nbsp; M 静音 &nbsp;|&nbsp; 空格 炸弹 &nbsp;|&nbsp; E 必杀</p>
      <div class="opt-row"><span>屏幕震动</span><button id="btn-shake" class="opt-toggle">开</button></div>
    </div>
    <button id="btn-resume" class="btn">继续</button>
    <button id="btn-quit" class="btn btn-ghost">返回主菜单</button>
  </div>

  <div id="screen-over" class="screen hidden">
    <div class="screen-title danger">战斗坠毁</div>
    <div class="over-stats">
      <div><span>本局得分</span><b id="over-score">0</b></div>
      <div><span>击落敌机</span><b id="over-kills">0</b></div>
      <div><span>抵达关卡</span><b id="over-wave">1</b></div>
      <div><span>最高连击</span><b id="over-combo">×0</b></div>
      <div><span>本局用时</span><b id="over-time">0分00秒</b></div>
      <div><span>本局成就</span><b id="over-ach">—</b></div>
      <div id="over-newbest" class="hidden">★ 新纪录 ★</div>
    </div>
    <button id="btn-retry" class="btn">再次出击</button>
    <button id="btn-menu" class="btn btn-ghost">返回主菜单</button>
    <p class="over-hint">按 Enter 快速再战</p>
  </div>

  <!-- 通用信息弹窗（v12.1：键位说明 / 玩法 / 选关 / 成就） -->
  <div id="modal" class="screen modal hidden">
    <div class="modal-box">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-body" id="modal-body"></div>
      <button id="modal-close" class="btn btn-ghost">返回</button>
    </div>
  </div>
</div>
<script src="src/js/audio.js?v=1311"></script>
<script src="src/js/profile.js?v=1311"></script>
<script src="src/js/entities.js?v=1311"></script>
<script src="src/js/game.js?v=1311"></script>
<script src="src/js/main.js?v=1311"></script>
</body>
</html>
